---
title: 页面不存在
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面不存在</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8f8f8;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container { text-align: center; padding: 2rem; }
    .code {
      font-size: 6rem;
      font-weight: 700;
      color: #ddd;
      line-height: 1;
      letter-spacing: -4px;
    }
    .message {
      font-size: 1.25rem;
      color: #666;
      margin: 1rem 0 2rem;
    }
    .home-link {
      display: inline-block;
      padding: 0.6rem 1.5rem;
      background: #333;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    .home-link:hover { background: #555; }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <p class="message">页面不存在或已被移动</p>
    <a class="home-link" href="/blog/">回到首页</a>
  </div>
</body>
</html>
